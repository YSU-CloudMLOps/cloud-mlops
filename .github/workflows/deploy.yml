name: CI/CD Pipeline - Cloud MLOps

on:
  push:
    branches:
      - main
      - test
  pull_request:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ============================================================================
  # 1. CI: Automated Tests & Artifact Verification
  # ============================================================================
  test-and-build:
    name: 🧪 Automated Test & Build Verification
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Check out repository code
        uses: actions/checkout@v4

      # Python Backend Setup & Unit Tests
      - name: 🐍 Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: "API/requirements-api.txt"

      - name: 📦 Install Python API dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r API/requirements-api.txt

      - name: 🚦 Run Backend Unit & Integration Tests (12 tests)
        run: |
          PYTHONPATH=. python -m unittest discover -s API/tests -v

      # Node.js Frontend Setup & Production Build
      - name: ⬢ Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: "frontend/package-lock.json"

      - name: 📦 Install Frontend dependencies
        working-directory: ./frontend
        run: |
          npm ci

      - name: 🏗️ Build React 19 Frontend bundle
        working-directory: ./frontend
        run: |
          npm run build

      # Docker Multi-container Build Verification
      - name: 🐳 Verify Docker Compose build
        run: |
          if [ ! -f .env ]; then
            cp .env.example .env
          fi
          docker compose build --parallel

  # ============================================================================
  # 2. CD: AWS Systems Manager (SSM) Zero-SSH Continuous Deployment
  #    - Solves Dynamic IP changes (No IP required, targets by Tag/Instance ID)
  #    - Solves EC2 deletion/recreation (Auto-discovers new instance or skips safely)
  #    - Eliminates SSH Port 22 exposure & PEM key management
  # ============================================================================
  deploy-ec2:
    name: 🚀 Deploy to AWS EC2 (SSM Zero-SSH)
    needs: test-and-build
    runs-on: ubuntu-latest
    if: (github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/test')) || github.event_name == 'workflow_dispatch'
    permissions:
      id-token: write
      contents: read

    steps:
      - name: 📥 Check out repository code
        uses: actions/checkout@v4

      - name: 🔍 Detect Deployment Mode (AWS SSM vs Legacy SSH vs Dry-Run)
        id: detect-mode
        env:
          AWS_ROLE_ARN: ${{ secrets.AWS_ROLE_ARN || 'arn:aws:iam::093356173512:role/s2023100154-github-deploy-role' }}
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          EC2_HOST: ${{ secrets.EC2_HOST }}
          EC2_SSH_KEY: ${{ secrets.EC2_SSH_KEY }}
        run: |
          if [ -n "$AWS_ROLE_ARN" ]; then
            echo "mode=ssm-oidc" >> $GITHUB_OUTPUT
            echo "✅ Mode Selected: AWS SSM Run Command (via OIDC IAM Role)"
          elif [ -n "$AWS_ACCESS_KEY_ID" ] && [ -n "$AWS_SECRET_ACCESS_KEY" ]; then
            echo "mode=ssm-keys" >> $GITHUB_OUTPUT
            echo "✅ Mode Selected: AWS SSM Run Command (via IAM Access Keys)"
          elif [ -n "$EC2_HOST" ] && [ -n "$EC2_SSH_KEY" ]; then
            echo "mode=ssh-legacy" >> $GITHUB_OUTPUT
            echo "✅ Mode Selected: Legacy SSH Deployment"
          else
            echo "mode=dry-run" >> $GITHUB_OUTPUT
            echo "ℹ️ Mode Selected: Dry-Run (Pending AWS SSM credentials setup)"
          fi

      # ------------------------------------------------------------------------
      # Mode A (Recommended - Option 3): AWS SSM Run Command
      # ------------------------------------------------------------------------
      - name: 🔑 Configure AWS Credentials (OIDC)
        if: steps.detect-mode.outputs.mode == 'ssm-oidc'
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN || 'arn:aws:iam::093356173512:role/s2023100154-github-deploy-role' }}
          aws-region: ${{ secrets.AWS_REGION || 'ap-northeast-2' }}

      - name: 🔑 Configure AWS Credentials (IAM Keys)
        if: steps.detect-mode.outputs.mode == 'ssm-keys'
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION || 'ap-northeast-2' }}

      - name: 🔎 Discover Active SSM-Managed EC2 Instance (Tag & Online Check)
        id: discover-ec2
        if: startsWith(steps.detect-mode.outputs.mode, 'ssm-')
        env:
          TARGET_INSTANCE_ID: ${{ secrets.EC2_INSTANCE_ID }}
          TARGET_TAG_KEY: ${{ secrets.EC2_TAG_KEY || 'Name' }}
          TARGET_TAG_VALUE: ${{ secrets.EC2_TAG_VALUE || 'mlops-server' }}
        run: |
          echo "=================================================================="
          echo "🔎 Searching for active EC2 instance via AWS Systems Manager..."
          echo "=================================================================="

          INSTANCE_ID=""

          # 1. Explicit Instance ID override if provided
          if [ -n "$TARGET_INSTANCE_ID" ]; then
            ONLINE_CHECK=$(aws ssm describe-instance-information \
              --filters "Key=InstanceIds,Values=$TARGET_INSTANCE_ID" "Key=PingStatus,Values=Online" \
              --query "InstanceInformationList[0].InstanceId" --output text 2>/dev/null || echo "None")
            if [ "$ONLINE_CHECK" != "None" ] && [ -n "$ONLINE_CHECK" ]; then
              INSTANCE_ID="$ONLINE_CHECK"
              echo "✅ Found explicitly configured SSM Online instance: $INSTANCE_ID"
            fi
          fi

          # 2. Discover by EC2 Tag (default: tag:Name=mlops-server) & running state
          if [ -z "$INSTANCE_ID" ]; then
            TAGGED_IDS=$(aws ec2 describe-instances \
              --filters "Name=tag:${TARGET_TAG_KEY},Values=${TARGET_TAG_VALUE}" "Name=instance-state-name,Values=running" \
              --query "Reservations[].Instances[].InstanceId" --output text 2>/dev/null || echo "")

            for CANDIDATE in $TAGGED_IDS; do
              ONLINE_CHECK=$(aws ssm describe-instance-information \
                --filters "Key=InstanceIds,Values=$CANDIDATE" "Key=PingStatus,Values=Online" \
                --query "InstanceInformationList[0].InstanceId" --output text 2>/dev/null || echo "None")
              if [ "$ONLINE_CHECK" != "None" ] && [ -n "$ONLINE_CHECK" ]; then
                INSTANCE_ID="$ONLINE_CHECK"
                echo "✅ Discovered running SSM Online instance by tag (${TARGET_TAG_KEY}=${TARGET_TAG_VALUE}): $INSTANCE_ID"
                break
              fi
            done
          fi

          # 3. Fallback: Auto-select if there is exactly 1 online SSM EC2 instance in the region
          if [ -z "$INSTANCE_ID" ]; then
            ALL_ONLINE=$(aws ssm describe-instance-information \
              --filters "Key=PingStatus,Values=Online" "Key=ResourceType,Values=EC2Instance" \
              --query "InstanceInformationList[].InstanceId" --output text 2>/dev/null || echo "")
            COUNT=$(echo "$ALL_ONLINE" | wc -w | tr -d ' ')
            if [ "$COUNT" -eq "1" ]; then
              INSTANCE_ID="$ALL_ONLINE"
              echo "✅ Discovered single active SSM Online EC2 instance in region: $INSTANCE_ID"
            fi
          fi

          # 4. Check if instance is missing (stopped or terminated) -> Trigger Option 4 Self-Healing
          if [ -z "$INSTANCE_ID" ]; then
            echo "found=false" >> $GITHUB_OUTPUT
            echo "=================================================================="
            echo "⚠️ No running/online SSM EC2 instance found right now."
            echo "   Proceeding to Option 4: Self-Healing ASG & Auto-Recovery Check..."
            echo "=================================================================="
          else
            echo "found=true" >> $GITHUB_OUTPUT
            echo "instance_id=$INSTANCE_ID" >> $GITHUB_OUTPUT
          fi

      # ------------------------------------------------------------------------
      # Option 4: Self-Healing Auto-Recovery (Stopped Instance Wakeup + ASG + Launch Template)
      # ------------------------------------------------------------------------
      - name: "🛡️ Self-Healing Infrastructure Recovery (Option 4: ASG + Launch Template)"
        id: self-healing
        if: startsWith(steps.detect-mode.outputs.mode, 'ssm-') && steps.discover-ec2.outputs.found == 'false'
        env:
          AWS_REGION: ${{ secrets.AWS_REGION || 'ap-northeast-2' }}
          TARGET_TAG_KEY: ${{ secrets.EC2_TAG_KEY || 'Name' }}
          TARGET_TAG_VALUE: ${{ secrets.EC2_TAG_VALUE || 'mlops-server' }}
          INSTANCE_TYPE: ${{ secrets.EC2_INSTANCE_TYPE || 't3.micro' }}
        run: |
          echo "=================================================================="
          echo "🛡️  [Option 4] Starting Self-Healing EC2 Recovery & ASG Provisioning"
          echo "=================================================================="

          RECOVERED_ID=""

          # Step A: Check if a tagged instance is simply in 'stopped' state and wake it up
          STOPPED_ID=$(aws ec2 describe-instances \
            --filters "Name=tag:${TARGET_TAG_KEY},Values=${TARGET_TAG_VALUE}" "Name=instance-state-name,Values=stopped" \
            --query "Reservations[0].Instances[0].InstanceId" --output text 2>/dev/null || echo "None")

          if [ "$STOPPED_ID" != "None" ] && [ -n "$STOPPED_ID" ]; then
            echo "🔄 Found stopped EC2 instance ($STOPPED_ID). Starting it automatically..."
            aws ec2 start-instances --instance-ids "$STOPPED_ID" >/dev/null 2>&1 || true
          else
            # Step B: Instance was completely deleted/terminated -> Provision/Sync Self-Healing ASG & Launch Template
            echo "🚀 No existing instance found (Terminated/Deleted)."
            echo "   Executing scripts/setup_asg_self_healing.sh to spawn replacement via Auto Scaling Group..."
            chmod +x scripts/ec2_user_data.sh scripts/setup_asg_self_healing.sh
            if ./scripts/setup_asg_self_healing.sh; then
              echo "✅ Self-Healing Auto Scaling Group & Launch Template active!"
            else
              echo "⚠️ Could not auto-provision ASG (IAM user may lack autoscaling/iam permissions)."
            fi
          fi

          # Step C: Poll up to 180s for the recovered/newly-spawned EC2 instance to become SSM Online
          echo "⏳ Waiting up to 180s for recovered/spawned EC2 instance to join AWS SSM Online..."
          for i in {1..18}; do
            CANDIDATES=$(aws ec2 describe-instances \
              --filters "Name=tag:${TARGET_TAG_KEY},Values=${TARGET_TAG_VALUE}" "Name=instance-state-name,Values=running" \
              --query "Reservations[].Instances[].InstanceId" --output text 2>/dev/null || echo "")

            for CID in $CANDIDATES; do
              ONLINE=$(aws ssm describe-instance-information \
                --filters "Key=InstanceIds,Values=$CID" "Key=PingStatus,Values=Online" \
                --query "InstanceInformationList[0].InstanceId" --output text 2>/dev/null || echo "None")
              if [ "$ONLINE" != "None" ] && [ -n "$ONLINE" ]; then
                RECOVERED_ID="$ONLINE"
                break
              fi
            done

            if [ -n "$RECOVERED_ID" ]; then
              echo "✅ Self-Healed EC2 Instance is now Running & SSM Online: $RECOVERED_ID"
              break
            fi
            echo "   [$i/18] Waiting for instance boot & SSM agent registration..."
            sleep 10
          done

          if [ -n "$RECOVERED_ID" ]; then
            echo "recovered=true" >> $GITHUB_OUTPUT
            echo "instance_id=$RECOVERED_ID" >> $GITHUB_OUTPUT
          else
            echo "recovered=false" >> $GITHUB_OUTPUT
            echo "=================================================================="
            echo "ℹ️ [SELF-HEALING NOTICE] Replacement instance is either still booting"
            echo "   via User Data (ec2_user_data.sh) or IAM permissions are restricted."
            echo "   Pipeline will complete cleanly without failing."
            echo "=================================================================="
          fi

      - name: 🚀 Execute Zero-SSH Deployment via AWS SSM Run Command
        if: startsWith(steps.detect-mode.outputs.mode, 'ssm-') && (steps.discover-ec2.outputs.found == 'true' || steps.self-healing.outputs.recovered == 'true')
        env:
          INSTANCE_ID: ${{ steps.discover-ec2.outputs.instance_id || steps.self-healing.outputs.instance_id }}
          TARGET_BRANCH: ${{ github.ref_name }}
        run: |
          set -e
          echo "=================================================================="
          echo "🚀 Dispatching SSM Run Command to Instance: $INSTANCE_ID"
          echo "   Branch: $TARGET_BRANCH (IP-independent / Port 22 Closed Ready)"
          echo "=================================================================="

          COMMAND_ID=$(aws ssm send-command \
            --instance-ids "$INSTANCE_ID" \
            --document-name "AWS-RunShellScript" \
            --comment "GitHub Actions CI/CD Auto-Deploy ($TARGET_BRANCH)" \
            --timeout-seconds 900 \
            --parameters commands="[
              \"set -e\",
              \"export DEBIAN_FRONTEND=noninteractive\",
              \"DEPLOY_USER=\$(id -un 1000 2>/dev/null || echo ubuntu)\",
              \"DEPLOY_DIR=/home/\$DEPLOY_USER/cloud-mlops\",
              \"if [ ! -d /home/\$DEPLOY_USER ]; then DEPLOY_DIR=/opt/cloud-mlops; fi\",
              \"echo '▶ Target deployment directory:' \$DEPLOY_DIR\",
              \"if [ ! -d \$DEPLOY_DIR/.git ]; then\",
              \"  git clone https://github.com/YSU-CloudMLOps/cloud-mlops.git \$DEPLOY_DIR\",
              \"  cd \$DEPLOY_DIR\",
              \"else\",
              \"  cd \$DEPLOY_DIR\",
              \"  git config --global --add safe.directory \$DEPLOY_DIR || true\",
              \"  git fetch --all --prune\",
              \"fi\",
              \"git checkout $TARGET_BRANCH\",
              \"git reset --hard origin/$TARGET_BRANCH\",
              \"git pull origin $TARGET_BRANCH\",
              \"if [ ! -f .env ]; then cp .env.example .env; fi\",
              \"chmod +x scripts/deploy_ec2.sh\",
              \"./scripts/deploy_ec2.sh\",
              \"chown -R \$DEPLOY_USER:\$DEPLOY_USER \$DEPLOY_DIR 2>/dev/null || true\"
            ]" \
            --query "Command.CommandId" --output text)

          echo "⏳ Waiting for SSM Command [$COMMAND_ID] to finish on $INSTANCE_ID..."

          for i in {1..90}; do
            STATUS=$(aws ssm get-command-invocation \
              --command-id "$COMMAND_ID" \
              --instance-id "$INSTANCE_ID" \
              --query "Status" --output text 2>/dev/null || echo "Pending")

            echo "   [$i/90] Current SSM Status: $STATUS"
            if [ "$STATUS" == "Success" ]; then
              echo "✅ SSM Deployment Succeeded!"
              aws ssm get-command-invocation \
                --command-id "$COMMAND_ID" \
                --instance-id "$INSTANCE_ID" \
                --query "StandardOutputContent" --output text
              exit 0
            elif [ "$STATUS" == "Failed" ] || [ "$STATUS" == "Cancelled" ] || [ "$STATUS" == "TimedOut" ]; then
              echo "❌ SSM Deployment Failed with status: $STATUS"
              echo "--- STDOUT ---"
              aws ssm get-command-invocation \
                --command-id "$COMMAND_ID" \
                --instance-id "$INSTANCE_ID" \
                --query "StandardOutputContent" --output text || true
              echo "--- STDERR ---"
              aws ssm get-command-invocation \
                --command-id "$COMMAND_ID" \
                --instance-id "$INSTANCE_ID" \
                --query "StandardErrorContent" --output text || true
              exit 1
            fi
            sleep 10
          done

          echo "❌ Timed out waiting for SSM command execution."
          exit 1

      # ------------------------------------------------------------------------
      # Mode B (Fallback): Legacy SSH Deployment
      # ------------------------------------------------------------------------
      - name: 🌐 Execute Legacy SSH Deployment on AWS EC2
        if: steps.detect-mode.outputs.mode == 'ssh-legacy'
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USERNAME || 'ubuntu' }}
          key: ${{ secrets.EC2_SSH_KEY }}
          port: ${{ secrets.EC2_PORT || 22 }}
          timeout: 120s
          command_timeout: 15m
          script: |
            set -e
            DEPLOY_DIR="$HOME/cloud-mlops"
            if [ ! -d "$DEPLOY_DIR/.git" ]; then
              git clone https://github.com/YSU-CloudMLOps/cloud-mlops.git "$DEPLOY_DIR"
              cd "$DEPLOY_DIR"
            else
              cd "$DEPLOY_DIR"
              git fetch --all --prune
            fi
            git checkout ${{ github.ref_name }}
            git reset --hard origin/${{ github.ref_name }}
            git pull origin ${{ github.ref_name }}
            if [ ! -f .env ]; then cp .env.example .env; fi
            chmod +x scripts/deploy_ec2.sh
            sudo ./scripts/deploy_ec2.sh

      # ------------------------------------------------------------------------
      # Mode C: Informative Dry-Run Guide when secrets are not configured yet
      # ------------------------------------------------------------------------
      - name: ℹ️ Deployment Guide & Dry-Run Notice (AWS SSM Setup)
        if: steps.detect-mode.outputs.mode == 'dry-run'
        run: |
          echo "================================================================================"
          echo "ℹ️  GITHUB ACTIONS CI/CD NOTICE: AWS SSM ZERO-SSH DEPLOYMENT READY"
          echo "================================================================================"
          echo "All CI tests (12 Backend unit/integration tests + React 19 Frontend build"
          echo "+ Docker Compose build) passed with 100% success!"
          echo ""
          echo "To enable IP-independent, Zero-SSH automatic deployment via AWS SSM:"
          echo "1. Attach IAM Role with 'AmazonSSMManagedInstanceCore' policy to your EC2."
          echo "2. Tag your EC2 instance with Name=mlops-server (optional if only 1 EC2 exists)."
          echo "3. Add the following GitHub Repository Secrets:"
          echo "   - AWS_ACCESS_KEY_ID     : AWS IAM Access Key with SSM/EC2 permissions"
          echo "   - AWS_SECRET_ACCESS_KEY : AWS IAM Secret Key"
          echo "   - AWS_REGION            : AWS Region (default: ap-northeast-2)"
          echo "================================================================================"
