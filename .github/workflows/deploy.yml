name: CI/CD Pipeline - Cloud MLOps

on:
  push:
    branches:
      - main
      - test
  pull_request:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ============================================================================
  # 1. CI: Automated Tests & Artifact Verification
  # ============================================================================
  test-and-build:
    name: 🧪 Automated Test & Build Verification
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Check out repository code
        uses: actions/checkout@v4

      # Python Backend Setup & Unit Tests
      - name: 🐍 Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: "API/requirements-api.txt"

      - name: 📦 Install Python API dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r API/requirements-api.txt

      - name: 🚦 Run Backend Unit & Integration Tests (12 tests)
        run: |
          PYTHONPATH=. python -m unittest discover -s API/tests -v

      # Node.js Frontend Setup & Production Build
      - name: ⬢ Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: "frontend/package-lock.json"

      - name: 📦 Install Frontend dependencies
        working-directory: ./frontend
        run: |
          npm ci

      - name: 🏗️ Build React 19 Frontend bundle
        working-directory: ./frontend
        run: |
          npm run build

      # Docker Multi-container Build Verification
      - name: 🐳 Verify Docker Compose build
        run: |
          if [ ! -f .env ]; then
            cp .env.example .env
          fi
          docker compose build --parallel

  # ============================================================================
  # 2. CD: AWS EC2 Continuous Deployment
  # ============================================================================
  deploy-ec2:
    name: 🚀 Deploy to AWS EC2
    needs: test-and-build
    runs-on: ubuntu-latest
    if: (github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/test')) || github.event_name == 'workflow_dispatch'

    steps:
      - name: 📥 Check out repository code
        uses: actions/checkout@v4

      - name: 🔍 Check EC2 Deployment Secrets Availability
        id: check-secrets
        env:
          EC2_HOST: ${{ secrets.EC2_HOST }}
          EC2_SSH_KEY: ${{ secrets.EC2_SSH_KEY }}
        run: |
          if [ -n "$EC2_HOST" ] && [ -n "$EC2_SSH_KEY" ]; then
            echo "configured=true" >> $GITHUB_OUTPUT
            echo "✅ EC2_HOST and EC2_SSH_KEY secrets are detected."
          else
            echo "configured=false" >> $GITHUB_OUTPUT
            echo "⚠️ EC2 deployment secrets (EC2_HOST, EC2_SSH_KEY) are not set yet."
          fi

      # Case A: Execute remote deployment via SSH when secrets are configured
      - name: 🌐 Execute Remote Deployment on AWS EC2
        if: steps.check-secrets.outputs.configured == 'true'
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USERNAME || 'ubuntu' }}
          key: ${{ secrets.EC2_SSH_KEY }}
          port: ${{ secrets.EC2_PORT || 22 }}
          timeout: 120s
          command_timeout: 15m
          script: |
            set -e
            DEPLOY_DIR="$HOME/cloud-mlops"
            echo "=================================================================="
            echo "▶ Deploying branch [${{ github.ref_name }}] on EC2: $(hostname)"
            echo "=================================================================="
            
            # Clone if not present, otherwise pull latest changes
            if [ ! -d "$DEPLOY_DIR/.git" ]; then
              echo "[*] Cloning repository to $DEPLOY_DIR..."
              git clone https://github.com/YSU-CloudMLOps/cloud-mlops.git "$DEPLOY_DIR"
              cd "$DEPLOY_DIR"
            else
              cd "$DEPLOY_DIR"
              echo "[*] Fetching latest commits from origin..."
              git fetch --all --prune
            fi

            # Checkout and pull the target branch
            git checkout ${{ github.ref_name }}
            git reset --hard origin/${{ github.ref_name }}
            git pull origin ${{ github.ref_name }}

            # Ensure .env exists
            if [ ! -f .env ]; then
              echo "[*] Initializing .env from .env.example..."
              cp .env.example .env
            fi

            # Execute automated deployment script
            chmod +x scripts/deploy_ec2.sh
            echo "[*] Running deploy_ec2.sh..."
            sudo ./scripts/deploy_ec2.sh

            echo "=================================================================="
            echo "✅ GitHub Actions Automated Deployment Finished Successfully!"
            echo "=================================================================="

      # Case B: Informative Dry-Run Notification when secrets are not configured yet
      - name: ℹ️ Deployment Guide & Dry-Run Notice
        if: steps.check-secrets.outputs.configured != 'true'
        run: |
          echo "================================================================================"
          echo "ℹ️  GITHUB ACTIONS CI/CD NOTICE: SECRETS PENDING SETUP"
          echo "================================================================================"
          echo "All CI tests (12 Backend unit/integration tests + React 19 Frontend build"
          echo "+ Docker Compose build) passed with 100% success!"
          echo ""
          echo "To enable automatic zero-touch CD deployment to your AWS EC2 instance:"
          echo "1. Go to your GitHub Repository -> Settings -> Secrets and variables -> Actions"
          echo "2. Add the following repository secrets:"
          echo "   - EC2_HOST     : Public IP or DNS of your AWS EC2 instance (e.g. 13.125.x.x)"
          echo "   - EC2_USERNAME : SSH username (default: 'ubuntu' or 'ec2-user')"
          echo "   - EC2_SSH_KEY  : Content of your EC2 SSH private key (.pem file)"
          echo "   - EC2_PORT     : SSH Port (default: 22, optional)"
          echo ""
          echo "Once registered, every push to 'main' or 'test' will automatically update"
          echo "and reload the Docker containers on your EC2 instance."
          echo "================================================================================"
