services:
  # ========================================================
  # Backend Service: FastAPI + LightGBM Predictive Model
  # ========================================================
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: mlops-backend
    restart: unless-stopped
    environment:
      - API_HOST=0.0.0.0
      - API_PORT=8000
      - MODEL_PATH=${MODEL_PATH:-/app/models/lightgbm_model.txt}
      - THRESHOLD=${THRESHOLD:-0.5}
      - AWS_REGION=${AWS_REGION:-ap-northeast-2}
      - CW_LOG_GROUP=${CW_LOG_GROUP:-/mlops/predictive-maintenance/inference}
      - CW_LOG_STREAM=${CW_LOG_STREAM:-api-inference-stream-v2}
      - CW_LOGGING_ENABLED=${CW_LOGGING_ENABLED:-false}
      - S3_LOG_BUCKET=${S3_LOG_BUCKET:-cloud-mlops-pdm-logs}
      - S3_EXPORT_PREFIX=${S3_EXPORT_PREFIX:-cloudwatch-exports/retraining-rl}
    ports:
      # Host port configured via BACKEND_PORT in .env (default: 8000)
      - "${BACKEND_PORT:-8000}:8000"
    volumes:
      # Mount models directory as read-only so weights can be updated without rebuilding
      - ./models:/app/models:ro
      # Persist structured CloudWatch & S3 export logs on host
      - ./logs:/app/logs
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 5s
    networks:
      - mlops-network

  # ========================================================
  # Frontend Service: React 19 + Vite + Nginx Reverse Proxy
  # ========================================================
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: mlops-frontend
    restart: unless-stopped
    ports:
      # Host port configured via FRONTEND_PORT in .env (default: 80)
      - "${FRONTEND_PORT:-80}:80"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost/"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 5s
    networks:
      - mlops-network

networks:
  mlops-network:
    name: mlops-network
    driver: bridge
